# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# Compression (Google's 2021 security competition, by Google; a pwn challenge) as an Isoloom spec:
# a demo server for a custom compression format whose documentation is kept behind a password.
# The challenge folder 2021/quals/pwn-compression of Google's challenge archive is vendored unchanged in app/ and built by its own Dockerfile.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: google-ctf-2021-compression

networks:
  lab: { cidr: 10.60.173.0/24, internet: false }

machines:
  challenge:
    networks: { lab: 10 }
    services: [{ port: 1337, name: challenge, publish: 1337 }]
    resources: { cpus: 1, memory_mb: 512 }
    privileged: true  # the image's setup script mounts /proc and nsjail creates namespaces
    docker:
      build: app/challenge

checks:
  - name: the challenge service answers
    tcp: challenge:1337
    wait: 120
  - name: the menu offers to compress, decompress and read the format documentation
    script: checks/probe.sh
    wait: 60

message: |
  Compression (Google, 2021) answers at `nc localhost {{ machines.challenge.services.0.publish }}`.
  Option 3 wants a password. Learn the format from the compressor, then see what a hand-made stream makes the decompressor do.
